fallacies:
  - fallacy_id: equivocation
    name: 曖昧語の虚偽
    category: ambiguity
    detection:
      same_term_multiple_meanings: true
    action: pending_review
    explanation: "同じ名辞の意味が論証の途中ですり替わっている"

  - fallacy_id: hasty_generalization
    name: 早まった一般化
    category: scope
    detection:
      particular_to_universal: true
    action: downgrade_or_request_evidence
    explanation: "少数の事例から全体の性質を断定している"

  - fallacy_id: ad_verecundiam
    name: 権威論証
    category: evidence
    detection:
      authority_without_independent_evidence: true
    action: keep_as_endoxa
    explanation: "権威者の発言だけを根拠に事実化している"

  - fallacy_id: correlation_causation
    name: 相関と因果の混同
    category: relation
    detection:
      correlation_asserted_as_cause: true
    action: request_more_evidence
    explanation: "相関関係だけを根拠に因果関係を断定している"

  - fallacy_id: ignoring_exceptions
    name: 例外の無視
    category: exception
    detection:
      universal_claim_ignores_counterexample: true
    action: downgrade_or_request_evidence
    explanation: "反例または適用除外を無視して全称命題を維持している"

  - fallacy_id: necessary_sufficient_confusion
    name: 必要条件と十分条件の混同
    category: relation
    detection:
      necessary_asserted_as_sufficient: true
    action: pending_review
    explanation: "必要条件を十分条件として扱っている"